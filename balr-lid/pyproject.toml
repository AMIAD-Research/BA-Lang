[project]
name = "balr-lid"
version = "0.1.0"
description = "Two-stage SSL finetuning recipe for spoken language identification (frozen-head training, then full SSL finetuning), with an optional BA-LR binarized classification head."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "pandas>=2.0",
    "soundfile>=0.12",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
